[package]
name = "downloadit-web"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "DomTokenList",
  "NodeList",
  "HtmlInputElement",
  "HtmlAnchorElement",
  "HtmlDialogElement",
  "HtmlOptionElement",
  "HtmlSelectElement",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "EventSource",
  "MessageEvent",
  "Storage",
  "Navigator",
  "Clipboard",
  "ReadableStream",
  "WritableStream",
  "console"
] }
